<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudarshana AI - Super Intelligence Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2303140e' stroke='%23f59e0b' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%2310b981'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    :root {
      --bg-base: #03140e;
      --bg-gradient: radial-gradient(circle at 50% -10%, #093827 0%, #03140e 70%);
      --sidebar-bg: #041a12;
      --sidebar-border: #0d3828;
      --card-bg: #072419;
      --card-border: #114a34;
      --card-hover: #0c3324;
      --dock-bg: rgba(7, 36, 25, 0.95);
      --dock-border: #065f46;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent: #10b981;
      --accent-secondary: #059669;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --chakra-gold: #f59e0b;
    }

    body.theme-light {
      --bg-base: #f8fafc; --bg-gradient: linear-gradient(180deg, #f1f5f9 0%, #ffffff 100%);
      --sidebar-bg: #ffffff; --sidebar-border: #e2e8f0; --card-bg: #ffffff; --card-border: #cbd5e1; --card-hover: #f1f5f9; --dock-bg: rgba(255, 255, 255, 0.96); --dock-border: #cbd5e1; --text-main: #0f172a; --text-muted: #64748b; --accent: #059669; --accent-secondary: #047857; --accent-glow: rgba(5, 150, 105, 0.2);
    }
    body.theme-neon {
      --bg-base: #070114; --bg-gradient: radial-gradient(circle at 50% -10%, #2f0752 0%, #070114 75%);
      --sidebar-bg: #0d0221; --sidebar-border: #260f54; --card-bg: #14042e; --card-border: #3b127f; --card-hover: #22084d; --dock-bg: rgba(20, 4, 46, 0.94); --dock-border: #701a75; --text-main: #fdf4ff; --text-muted: #c084fc; --accent: #e879f9; --accent-secondary: #a855f7; --accent-glow: rgba(232, 121, 249, 0.4);
    }
    body.theme-cyberpunk {
      --bg-base: #0a0118; --bg-gradient: radial-gradient(circle at 50% -10%, #3e084d 0%, #090117 75%);
      --sidebar-bg: #120224; --sidebar-border: #3c095c; --card-bg: #1d0338; --card-border: #4d0b74; --card-hover: #2e0557; --dock-bg: rgba(29, 3, 56, 0.94); --dock-border: #be185d; --text-main: #ffffff; --text-muted: #f472b6; --accent: #f43f5e; --accent-secondary: #ec4899; --accent-glow: rgba(244, 63, 94, 0.4);
    }
    body.theme-sunset {
      --bg-base: #140704; --bg-gradient: radial-gradient(circle at 50% -10%, #45180c 0%, #120502 75%);
      --sidebar-bg: #1c0a05; --sidebar-border: #3d1b10; --card-bg: #270f08; --card-border: #4a2113; --card-hover: #36170d; --dock-bg: rgba(39, 15, 8, 0.94); --dock-border: #9a3412; --text-main: #fff7ed; --text-muted: #fdba74; --accent: #f97316; --accent-secondary: #ea580c; --accent-glow: rgba(249, 115, 22, 0.4);
    }
    body.theme-space {
      --bg-base: #020617; --bg-gradient: radial-gradient(circle at 50% -10%, #0f1e4d 0%, #020617 80%);
      --sidebar-bg: #040920; --sidebar-border: #0f1c4d; --card-bg: #071033; --card-border: #142466; --card-hover: #0c1c54; --dock-bg: rgba(7, 16, 51, 0.94); --dock-border: #0369a1; --text-main: #f0fdf4; --text-muted: #7dd3fc; --accent: #0ea5e9; --accent-secondary: #38bdf8; --accent-glow: rgba(14, 165, 233, 0.4);
    }

    html, body {
      width: 100%; height: 100%;
      background-color: var(--bg-base); background-image: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden; line-height: 1.5;
    }

    button, .chip, .suggestion-chip, .history-item { cursor: pointer; user-select: none; }
    button:active, .chip:active, .suggestion-chip:active { transform: scale(0.97); }

    /* Premium Entrance Animation Overlay */
    #introLoader {
      position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #introLoader.hide { opacity: 0; visibility: hidden; }
    .intro-chakra-container { width: 100px; height: 100px; position: relative; display: flex; align-items: center; justify-content: center; }
    .intro-chakra { width: 100px; height: 100px; animation: chakraSpin 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes chakraSpin { 0% { transform: rotate(0deg) scale(0.85); filter: drop-shadow(0 0 5px var(--accent)); } 50% { transform: rotate(180deg) scale(1.1); filter: drop-shadow(0 0 20px var(--chakra-gold)); } 100% { transform: rotate(360deg) scale(0.85); filter: drop-shadow(0 0 5px var(--accent)); } }
    .intro-title { margin-top: 16px; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; }

    /* App Layout */
    .app-container { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; overflow: hidden; }

    /* Sidebar Drawer */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 998; }
    .sidebar-overlay.active { display: block; }
    .sidebar {
      position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); z-index: 999; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
    }
    .sidebar.active { left: 0; }
    .sidebar-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--sidebar-border); }
    .sidebar-new-chat { margin: 12px 16px; padding: 10px 16px; background: var(--accent); color: #03140e; border: none; border-radius: 12px; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 8px; justify-content: center; box-shadow: 0 4px 12px var(--accent-glow); }
    .sidebar-history { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
    .history-group-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 10px 8px 4px; letter-spacing: 0.5px; }
    .history-item { padding: 10px 12px; border-radius: 10px; font-size: 13px; color: var(--text-main); display: flex; align-items: center; gap: 10px; text-decoration: none; background: transparent; border: none; width: 100%; text-align: left; }
    .history-item:hover { background: var(--card-hover); color: var(--accent); }
    .sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--sidebar-border); display: flex; flex-direction: column; gap: 8px; }
    .sidebar-footer-btn { display: flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text-muted); font-size: 13.5px; padding: 8px 10px; border-radius: 8px; width: 100%; text-align: left; }
    .sidebar-footer-btn:hover { background: var(--card-hover); color: var(--text-main); }

    /* Main Chat Area */
    .main-chat-area { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; min-width: 0; background: var(--bg-base); }
    
    /* Header */
    .chat-header {
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-base); border-bottom: 1px solid var(--sidebar-border); z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }

    /* Chat Body / Home Screen */
    .chat-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; padding-bottom: 20px; }
    
    /* Empty State / Home */
    .home-hero {
      margin: auto; padding: 24px 16px; max-width: 680px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center;
    }
    .home-chakra-icon { width: 56px; height: 56px; margin-bottom: 16px; animation: chakraSpin 8s linear infinite; filter: drop-shadow(0 0 10px var(--accent-glow)); }
    .home-title { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 6px; }
    .home-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    .suggestion-chips-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 600px; }
    .suggestion-chip {
      background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 20px; font-size: 13px; color: var(--text-main); display: flex; align-items: center; gap: 8px; font-weight: 500; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .suggestion-chip:hover { border-color: var(--accent); background: var(--card-hover); color: var(--accent); }
    .suggestion-chip .material-icons { font-size: 16px; color: var(--accent); }

    /* Active Messages List */
    .messages-list { display: none; flex-direction: column; gap: 20px; padding: 20px 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .message-row { display: flex; flex-direction: column; width: 100%; gap: 6px; }
    .message-row.user { align-items: flex-end; }
    .message-row.assistant { align-items: flex-start; }
    
    .message-bubble {
      max-width: 88%; padding: 14px 18px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; word-break: break-word; position: relative;
    }
    .message-row.user .message-bubble {
      background: var(--card-hover); border: 1px solid var(--card-border); color: var(--text-main); border-bottom-right-radius: 4px;
    }
    .message-row.assistant .message-bubble {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); border-bottom-left-radius: 4px; width: 100%; max-width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    
    /* Message Actions Footer */
    .message-actions { display: flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 12px; color: var(--text-muted); }
    .msg-action-btn { background: none; border: none; color: var(--text-muted); display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .msg-action-btn:hover { background: var(--card-hover); color: var(--accent); }
    .msg-action-btn .material-icons { font-size: 14px; }

    /* Thinking State */
    .thinking-indicator {
      display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 14px; font-style: italic; padding: 8px 0;
    }
    .thinking-dots span {
      width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    /* Composer / Command Center */
    .composer-wrapper { padding: 12px 16px 16px; background: var(--bg-base); border-top: 1px solid var(--sidebar-border); display: flex; flex-direction: column; gap: 8px; max-width: 820px; width: 100%; margin: 0 auto; position: sticky; bottom: 0; z-index: 100; }
    
    .attachment-preview-bar {
      display: none; align-items: center; gap: 10px; padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; font-size: 13px;
    }
    .attachment-preview-bar img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }

    .composer-box {
      width: 100%; background: var(--dock-bg); border: 1px solid var(--dock-border); border-radius: 28px; padding: 8px 12px; display: flex; align-items: flex-end; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); backdrop-filter: blur(10px);
    }
    .composer-textarea {
      flex: 1; min-height: 24px; max-height: 140px; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 15px; font-family: inherit; resize: none; padding: 4px 0;
    }
    .composer-actions { display: flex; align-items: center; gap: 4px; padding-bottom: 2px; }
    .composer-icon-btn { background: none; border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .composer-icon-btn:hover { color: var(--accent); background: var(--card-hover); }
    .send-stop-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #03140e; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px var(--accent-glow); }
    .send-stop-btn:hover { filter: brightness(1.1); }

    /* Plus Menu Popover */
    .plus-menu {
      display: none; position: absolute; bottom: 80px; left: 16px; background: var(--sidebar-bg); border: 1px solid var(--sidebar-border); border-radius: 16px; padding: 8px; width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 200; flex-direction: column; gap: 2px;
    }
    .plus-menu.active { display: flex; }
    .plus-menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: none; border: none; color: var(--text-main); font-size: 13.5px; border-radius: 10px; width: 100%; text-align: left; }
    .plus-menu-item:hover { background: var(--card-hover); color: var(--accent); }
    .plus-menu-item .material-icons { font-size: 18px; color: var(--accent); }

    /* Voice Assistant Overlay */
    .voice-overlay {
      display: none; position: fixed; inset: 0; background: rgba(3, 20, 14, 0.95); backdrop-filter: blur(12px); z-index: 3000; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; text-align: center;
    }
    .voice-overlay.active { display: flex; }
    .voice-status { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .voice-visualizer { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0%, rgba(16,185,129,0.1) 70%); box-shadow: 0 0 50px var(--accent-glow); animation: voicePulse 2s infinite ease-in-out; display: flex; align-items: center; justify-content: center; }
    @keyframes voicePulse { 0%, 100% { transform: scale(0.95); box-shadow: 0 0 30px var(--accent-glow); } 50% { transform: scale(1.08); box-shadow: 0 0 60px var(--accent); } }
    .voice-transcript { font-size: 16px; color: var(--text-main); max-width: 500px; min-height: 50px; }
    .voice-controls { display: flex; align-items: center; gap: 20px; }
    .voice-ctrl-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); display: flex; align-items: center; justify-content: center; }
    .voice-ctrl-btn.danger { background: #ef4444; border-color: #dc2626; color: #fff; }

    /* Settings & Themes Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 4000; padding: 20px; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 16px; }
    .modal-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* Hidden input */
    #fileInput { display: none; }
  </style>
</head>
<body class="theme-dark">

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.doc,.docx" onchange="handleFileSelected(event)">

  <!-- Premium Entrance Animation Overlay -->
  <div id="introLoader">
    <div class="intro-chakra-container">
      <svg class="intro-chakra" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
        <circle cx="50" cy="50" r="36" fill="none" stroke="#10b981" stroke-width="2"/>
        <g fill="#f59e0b">
          <polygon points="50,4 53,16 47,16"/><polygon points="50,96 53,84 47,84"/>
          <polygon points="4,50 16,53 16,47"/><polygon points="96,50 84,53 84,47"/>
        </g>
        <circle cx="50" cy="50" r="24" fill="#03140e" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="50" cy="50" r="8" fill="#10b981"/>
      </svg>
    </div>
    <div class="intro-title">Sudarshana AI</div>
  </div>

  <!-- Sidebar Drawer -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-weight:800; font-size:16px; color:var(--accent);">Sudarshana</span>
      </div>
      <button class="icon-btn" onclick="toggleSidebar()"><span class="material-icons">close</span></button>
    </div>
    <button class="sidebar-new-chat" onclick="startNewChat()"><span class="material-icons" style="font-size:18px;">add</span> New Chat</button>
    <div class="sidebar-history" id="sidebarHistory">
      <div class="history-group-title">Today</div>
      <!-- History items injected dynamically -->
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn" onclick="openThemeModal()"><span class="material-icons">palette</span> Themes & Appearance</button>
      <button class="sidebar-footer-btn" onclick="openSettingsModal()"><span class="material-icons">settings</span> Settings & Memory</button>
    </div>
  </aside>

  <!-- Voice Assistant Overlay -->
  <div class="voice-overlay" id="voiceOverlay">
    <div style="display:flex; width:100%; justify-content:flex-end;">
      <button class="icon-btn" onclick="stopVoiceAssistant()"><span class="material-icons">close</span></button>
    </div>
    <div class="voice-status" id="voiceStatus">Listening...</div>
    <div class="voice-visualizer">
      <span class="material-icons" style="font-size:48px; color:#fff;">mic</span>
    </div>
    <div class="voice-transcript" id="voiceTranscript">Speak now, I am listening...</div>
    <div class="voice-controls">
      <button class="voice-ctrl-btn danger" onclick="stopVoiceAssistant()"><span class="material-icons">stop</span></button>
    </div>
  </div>

    <!-- 8 Themes Modal -->
  <div class="modal-overlay" id="themeModal">
    <div class="themes-modal-box">
      <div style="padding:14px 18px; border-bottom:1px solid var(--card-border); display:flex; justify-content:space-between; align-items:center;">
        <div><span style="font-weight:800; font-size:16px;">Choose Your Theme</span></div>
        <button class="icon-btn" onclick="closeThemeModal()"><span class="material-icons">close</span></button>
      </div>
      <div class="themes-grid">
        <div class="theme-card-choice" onclick="applyTheme('dark')"><div class="theme-circle-dot" style="background:#030712; border:2px solid #38bdf8;"></div><h5>Dark</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('light')"><div class="theme-circle-dot" style="background:#f8fafc; border:2px solid #0284c7;"></div><h5>Light</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('neon')"><div class="theme-circle-dot" style="background:#070114; border:2px solid #e879f9;"></div><h5>Neon</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('nature')"><div class="theme-circle-dot" style="background:#03140e; border:2px solid #10b981;"></div><h5>Nature</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('cyberpunk')"><div class="theme-circle-dot" style="background:#0a0118; border:2px solid #f43f5e;"></div><h5>Cyberpunk</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('sunset')"><div class="theme-circle-dot" style="background:#140704; border:2px solid #f97316;"></div><h5>Sunset</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('space')"><div class="theme-circle-dot" style="background:#020617; border:2px solid #0ea5e9;"></div><h5>Space</h5></div>
        <div class="theme-card-choice" onclick="applyTheme('minimal')"><div class="theme-circle-dot" style="background:#f1f5f9; border:2px solid #6366f1;"></div><h5>Minimal</h5></div>
      </div>
    </div>
  </div>

  <script>
    const part1 = "AQ.Ab8RN6Kky";
    const part2 = "EvbiqLRoB-g_LOr7";
    const part3 = "7UH9Iz3TEGqQF1bO_Quo35UEA";
    const GEMINI_API_KEY = part1 + part2 + part3;

    let isMultiAIOn = true;
    let currentAttachedFile = null;

    function toggleConsensusMode() {
      isMultiAIOn = !isMultiAIOn;
      const container = document.getElementById('consensusToggle');
      if (isMultiAIOn) {
        container.classList.add('active');
      } else {
        container.classList.remove('active');
      }
      triggerHaptic(30);
    }

    function triggerHaptic(duration = 25) {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(duration); } catch (e) {}
      }
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, .chip, .quick-box, .tool-box, .recent-item, .theme-card-choice, .banner-btn, .consensus-toggle-container')) {
        triggerHaptic(25);
      }
    });

    function triggerFileInput() {
      document.getElementById('fileInput').click();
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentAttachedFile = {
          name: file.name,
          type: file.type,
          dataUrl: e.target.result
        };

        const preview = document.getElementById('attachmentPreview');
        const thumb = document.getElementById('previewThumb');
        const nameSpan = document.getElementById('previewName');

        nameSpan.textContent = file.name;
        if (file.type.startsWith('image/')) {
          thumb.src = e.target.result;
          thumb.style.display = 'block';
        } else {
          thumb.style.display = 'none';
        }
        preview.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      currentAttachedFile = null;
      document.getElementById('attachmentPreview').style.display = 'none';
      document.getElementById('fileInput').value = '';
    }

    function isImageRequest(prompt) {
      const p = prompt.toLowerCase();
      return p.includes('generate image') || p.includes('create image') || p.includes('draw') || p.includes('picture of') || p.includes('image of') || p.includes('photo of') || p.startsWith('image:');
    }

    async function callAIModel(userQuery, styleVariant = "direct") {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      let systemPrompt = "You are Sudarshana AI, an expert, precise, and helpful AI assistant. Answer the following user query directly, thoroughly, and accurately in detail: ";
      if (styleVariant === "alpha") {
        systemPrompt = "Provide an in-depth, structured, and comprehensive breakdown for the query: ";
      } else if (styleVariant === "beta") {
        systemPrompt = "Provide a practical, user-friendly, and actionable perspective with step-by-step guidance for: ";
      } else if (styleVariant === "gamma") {
        systemPrompt = "Provide an expert technical, analytical, and optimized solution for: ";
      }

      const finalPromptPayload = systemPrompt + userQuery;

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: finalPromptPayload }] }] })
      });
      
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || "Server connection error. Please check your network or API status.");
      }
      
      const answer = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!answer) {
        throw new Error("No response received from AI model.");
      }
      return answer;
    }

    function generateImageUrl(prompt) {
      const cleanPrompt = prompt.replace(/(generate image of|create image of|image of|picture of|generate visual of|photo of)/gi, '').trim();
      const seed = Math.floor(Math.random() * 999999);
      return `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt || prompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
    }

    function startChat(text) {
      stopAudio();
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('fullChatView').style.display = 'flex';
      runQueryDispatcher(text);
    }

    function backToHome() {
      stopAudio();
      document.getElementById('fullChatView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
    }

    function newChat() {
      stopAudio();
      document.getElementById('chatMessages').innerHTML = '';
      startChat('Hello!');
    }

    function stopAudio() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    async function runQueryDispatcher(text) {
      const container = document.getElementById('chatMessages');

      let userHtml = `<b>You</b><br>${text}`;
      if (currentAttachedFile) {
        if (currentAttachedFile.type.startsWith('image/')) {
          userHtml += `<br><img src="${currentAttachedFile.dataUrl}" style="max-width:200px; border-radius:8px; margin-top:8px;">`;
        } else {
          userHtml += `<br><i>Attached file: ${currentAttachedFile.name}</i>`;
        }
      }

      const u = document.createElement('div');
      u.className = 'user-msg';
      u.innerHTML = userHtml;
      container.appendChild(u);
      container.scrollTop = container.scrollHeight;

      const attachedPayload = currentAttachedFile ? ` [Attached File: ${currentAttachedFile.name}]` : "";
      clearAttachment();

      const combinedText = text + attachedPayload;

      if (isImageRequest(text)) {
        const imgUrl = generateImageUrl(text);
        const a = document.createElement('div');
        a.className = 'ai-msg';
        a.innerHTML = `
          <div><b>Generated Artwork:</b></div>
          <div class="ai-image-container">
            <img src="${imgUrl}" alt="${text}" loading="lazy" onerror="this.src='https://via.placeholder.com/1024x1024?text=Image+Generation+Failed+-+Retry'">
            <div class="ai-image-bar">
              <span style="font-size:12px; color:var(--text-muted);">1024x1024 High-Res</span>
              <a href="${imgUrl}" target="_blank" download="sudarshana-ai.jpg" style="color:var(--accent); text-decoration:none; font-size:12.5px; font-weight:600;">Download</a>
            </div>
          </div>
        `;
        container.appendChild(a);
        container.scrollTop = container.scrollHeight;
        return;
      }

      const isSimpleGreeting = text.trim().toLowerCase().match(/^(hi|hello|hey|greetings|good morning|good evening|sup|kaise ho|bolo)$/);

      if (!isMultiAIOn || isSimpleGreeting) {
        const a = document.createElement('div');
        a.className = 'single-ai-msg';
        a.innerHTML = `<i style="color:var(--text-muted);">Thinking...</i>`;
        container.appendChild(a);
        container.scrollTop = container.scrollHeight;

        try {
          const reply = await callAIModel(combinedText, "direct");
          a.innerHTML = reply.replace(/\n/g, '<br>');
        } catch (err) {
          a.innerHTML = `<span style="color:#f87171;">Error: ${err.message}</span>`;
        }
        container.scrollTop = container.scrollHeight;

      } else {
        const wrapper = document.createElement('div');
        wrapper.className = 'multi-response-container';
        wrapper.innerHTML = `
          <div class="ai-output-card" id="card-ans1">
            <div class="ai-card-header"><div class="ai-card-avatar" style="background:#10a37f;">1</div>Perspective Alpha</div>
            <div class="ans-content"><i style="color:var(--text-muted);">Analyzing query...</i></div>
            <span class="ai-card-footer-link"><span class="material-icons" style="font-size:15px;">link</span> (Detailed breakdown)</span>
          </div>

          <div class="ai-output-card" id="card-ans2">
            <div class="ai-card-header"><div class="ai-card-avatar" style="background:#1a73e8;">2</div>Perspective Beta</div>
            <div class="ans-content"><i style="color:var(--text-muted);">Analyzing query...</i></div>
            <span class="ai-card-footer-link"><span class="material-icons" style="font-size:15px;">link</span> (Structured plan)</span>
          </div>

          <div class="ai-output-card" id="card-ans3">
            <div class="ai-card-header"><div class="ai-card-avatar" style="background:#d97706;">3</div>Perspective Gamma</div>
            <div class="ans-content"><i style="color:var(--text-muted);">Analyzing query...</i></div>
            <span class="ai-card-footer-link"><span class="material-icons" style="font-size:15px;">link</span> (Optimized steps)</span>
          </div>

          <div class="trophy-card" id="card-trophy" style="display:none;">
            <div class="trophy-title-row">
              <span class="material-icons" style="font-size:28px; color:#fbbf24;">military_tech</span>
              Final Best Answer
            </div>
            <div class="ai-card-header" style="margin-bottom:6px;">
              <div class="ai-card-avatar" style="background:var(--accent);">S</div>Sudarshana AI
            </div>
            <div id="trophy-text" style="font-size:13.5px; line-height:1.55; color:var(--text-main);">
              Synthesizing best consensus...
            </div>
            <div class="best-badge">
              <span class="material-icons" style="font-size:16px;">check_circle</span> Best Answer: Sudarshana AI
            </div>
          </div>
        `;
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;

        try {
          const [ans1, ans2, ans3] = await Promise.all([
            callAIModel(combinedText, "alpha"),
            callAIModel(combinedText, "beta"),
            callAIModel(combinedText, "gamma")
          ]);

          document.querySelector('#card-ans1 .ans-content').innerHTML = ans1.replace(/\n/g, '<br>');
          document.querySelector('#card-ans2 .ans-content').innerHTML = ans2.replace(/\n/g, '<br>');
          document.querySelector('#card-ans3 .ans-content').innerHTML = ans3.replace(/\n/g, '<br>');

          const trophyCard = wrapper.querySelector('#card-trophy');
          const trophyText = wrapper.querySelector('#trophy-text');

          const bestSynthesis = `<b>Synthesized Verdict:</b> After evaluating all perspectives for your query (<i>"${text}"</i>), Sudarshana AI has integrated the most accurate, practical, and comprehensive insights above into this ultimate response.`;
          trophyText.innerHTML = bestSynthesis;
          trophyCard.style.display = 'block';
        } catch (err) {
          wrapper.innerHTML = `<div class="ai-output-card"><div class="ans-content" style="color:#f87171;">Failed to fetch consensus: ${err.message}</div></div>`;
        }
        container.scrollTop = container.scrollHeight;
      }
    }

    function submitMain() {
      const val = document.getElementById('mainInput').value.trim();
      if (!val && !currentAttachedFile) return;
      document.getElementById('mainInput').value = '';
      startChat(val || "Analyze attached file/image");
    }

    function sendChatMessage() {
      const val = document.getElementById('chatInput').value.trim();
      if (!val && !currentAttachedFile) return;
      document.getElementById('chatInput').value = '';
      runQueryDispatcher(val || "Analyze attached file/image");
    }

    function triggerPreset(text) {
      const inp = document.getElementById('mainInput');
      inp.value = text;
      inp.focus();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function openSidebar() { document.getElementById('sideDrawer').classList.add('active'); document.getElementById('sideOverlay').style.display = 'block'; }
    function closeSidebar() { document.getElementById('sideDrawer').classList.remove('active'); document.getElementById('sideOverlay').style.display = 'none'; }
    function openThemeModal() { document.getElementById('themeModal').style.display = 'flex'; }
    function closeThemeModal() { document.getElementById('themeModal').style.display = 'none'; }
    function applyTheme(name) { document.body.className = ''; document.body.classList.add('theme-' + name); localStorage.setItem('sudarshana_theme', name); closeThemeModal(); }
    function openFeedback() { const f = prompt("Feedback for Sudarshana AI:"); if (f) alert("Thank you! Feedback recorded."); }
    function openSettings() { alert("Sudarshana Multi-AI Hub\nStatus: Live Gemini API Connected"); }

    function startMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Speech recognition not supported.");
      const rec = new SpeechRecognition();
      rec.lang = 'en-US';
      const mic = document.getElementById('micIcon');
      mic.style.color = 'var(--accent)';
      rec.onresult = (e) => { document.getElementById('mainInput').value = e.results[0][0].transcript; mic.style.color = 'inherit'; };
      rec.onerror = () => { mic.style.color = 'inherit'; };
      rec.onend = () => { mic.style.color = 'inherit'; };
      rec.start();
    }

    document.getElementById('mainInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMain(); });
    document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

    (function() {
      const saved = localStorage.getItem('sudarshana_theme') || 'dark';
      document.body.className = 'theme-' + saved;
    })();

    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('introLoader');
        if (loader) loader.classList.add('hide');
      }, 1500);
    });
  </script>
</body>
</html>

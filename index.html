<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudarshana Chat AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230f172a' stroke='%2338bdf8' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%230284c7'/%3E%3Cg stroke='%2338bdf8' stroke-width='3'%3E%3Cline x1='50' y1='6' x2='50' y2='94'/%3E%3Cline x1='6' y1='50' x2='94' y2='50'/%3E%3Cline x1='19' y1='19' x2='81' y2='81'/%3E%3Cline x1='19' y1='81' x2='81' y2='19'/%3E%3C/g%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .app-frame {
      width: 100%; max-width: 600px; height: 100vh; height: 100dvh;
      margin: 0 auto; background: #000; display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #09090b; border-bottom: 1px solid #1f1f23;
      flex-shrink: 0; z-index: 50; position: relative;
    }
    .header-btn {
      background: none; border: none; color: #f4f4f5; font-size: 24px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 8px; border-radius: 50%;
    }
    .header-btn:active { background: #27272a; }
    .header-title-box { display: flex; align-items: center; gap: 8px; }
    .header-chakra { width: 26px; height: 26px; animation: spinChakra 10s linear infinite; }
    @keyframes spinChakra { 100% { transform: rotate(360deg); } }

    /* Dropdown Menu */
    .menu-dropdown {
      display: none; position: absolute; top: 54px; right: 14px;
      width: 210px; background: #18181b; border: 1px solid #27272a;
      border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 1000; padding: 6px; flex-direction: column; gap: 2px;
    }
    .menu-dropdown.active { display: flex; }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      font-size: 14px; color: #f4f4f5; border-radius: 8px; cursor: pointer;
      background: none; border: none; width: 100%; text-align: left;
    }
    .menu-item:active { background: #27272a; }
    .menu-item .material-icons { font-size: 18px; color: #a1a1aa; }
    .menu-item.danger { color: #f87171; }
    .menu-item.danger .material-icons { color: #f87171; }

    /* Sidebar */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 998;
    }
    .sidebar-overlay.active { display: block; }
    .sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: #111113; border-right: 1px solid #27272a; z-index: 999;
      transition: left 0.25s ease-out; display: flex; flex-direction: column;
    }
    .sidebar.active { left: 0; }
    .sidebar-header {
      padding: 16px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #1f1f23;
    }
    .sidebar-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .side-nav-btn {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: none; border: none; color: #d4d4d8; font-size: 14.5px;
      border-radius: 8px; text-align: left; width: 100%; cursor: pointer;
    }
    .side-nav-btn:active { background: #1f1f23; color: #38bdf8; }
    .side-nav-btn .material-icons { font-size: 20px; color: #71717a; }

    /* Chat Area */
    .chat-box {
      flex: 1; padding: 16px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 12px; background: #000;
    }
    .home-cards { margin: auto 0; display: flex; flex-direction: column; gap: 10px; }
    .home-card {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      background: #121215; border: 1px solid #27272a; border-radius: 12px;
      color: #e4e4e7; font-size: 14px; cursor: pointer; text-align: left;
    }
    .home-card:active { background: #1c1c20; border-color: #38bdf8; }
    .home-card .material-icons { color: #38bdf8; font-size: 22px; }

    /* Messages */
    .user-bubble {
      align-self: flex-end; background: #27272a; padding: 12px 16px;
      border-radius: 18px 18px 4px 18px; color: #fff; max-width: 82%;
      font-size: 14.5px; word-break: break-word;
    }
    .ai-bubble {
      align-self: flex-start; background: #09090b; border: 1px solid #1f1f23;
      padding: 14px 16px; border-radius: 18px 18px 18px 4px; color: #e4e4e7;
      max-width: 86%; font-size: 14.5px; line-height: 1.5; word-break: break-word;
    }
    .msg-actions { display: flex; gap: 8px; margin-top: 10px; }
    .msg-act-btn {
      background: #18181b; border: 1px solid #27272a; color: #a1a1aa;
      border-radius: 16px; padding: 4px 10px; display: flex; align-items: center;
      gap: 4px; font-size: 12px; cursor: pointer;
    }

    /* Input Footer */
    .footer-bar {
      padding: 10px 14px 14px; background: #000; flex-shrink: 0; z-index: 40;
    }
    .input-pill {
      background: #141416; border: 1px solid #27272a; border-radius: 28px;
      display: flex; align-items: center; padding: 4px 8px 4px 12px; gap: 6px;
    }
    .icon-click {
      background: none; border: none; color: #888; display: flex;
      align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
    }
    .icon-click:active { background: #27272a; color: #fff; }
    .chat-input {
      flex: 1; background: none; border: none; color: #fff;
      font-size: 15px; outline: none; padding: 8px 0;
    }
    .submit-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: #27272a; color: #fff; display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .submit-btn.send-active {
      background: #0284c7 !super; background: #0284c7; color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- Sidebar Drawer -->
    <div class="sidebar-overlay" id="sideOverlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span style="font-weight:600; font-size:16px;">Sudarshana AI</span>
        <button class="header-btn" onclick="closeSidebar()"><span class="material-icons">close</span></button>
      </div>
      <div class="sidebar-list">
        <button class="side-nav-btn" onclick="newChat(); closeSidebar()"><span class="material-icons">add</span> New Chat</button>
        <button class="side-nav-btn" onclick="alert('Recent history loaded'); closeSidebar()"><span class="material-icons">history</span> Chat History</button>
        <button class="side-nav-btn" onclick="alert('Settings menu'); closeSidebar()"><span class="material-icons">settings</span> Settings</button>
      </div>
    </div>

    <!-- Top Header -->
    <div class="header">
      <div class="header-title-box">
        <button class="header-btn" onclick="openSidebar()"><span class="material-icons">menu</span></button>
        <svg class="header-chakra" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#38bdf8" stroke-width="3"/>
          <circle cx="50" cy="50" r="18" fill="#0284c7"/>
        </svg>
        <span style="font-weight: 600; font-size: 16px;">Sudarshana</span>
      </div>

      <div style="display:flex; align-items:center; gap:2px;">
        <button class="header-btn" onclick="newChat()"><span class="material-icons">edit_square</span></button>
        <button class="header-btn" onclick="toggleMenu()"><span class="material-icons">more_vert</span></button>
      </div>

      <!-- Menu Dropdown -->
      <div class="menu-dropdown" id="menuDropdown">
        <button class="menu-item" onclick="newChat()"><span class="material-icons">add_comment</span> New Conversation</button>
        <button class="menu-item" onclick="alert('Sudarshana is configured to answer in English.')"><span class="material-icons">info</span> Status Info</button>
        <button class="menu-item danger" onclick="newChat()"><span class="material-icons">delete</span> Clear Chat</button>
      </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-box" id="chatBox">
      <div class="home-cards" id="homeCards">
        <div class="home-card" onclick="quickFill('Create an image description of a cosmic city')">
          <span class="material-icons">palette</span>
          <span>Create an image prompt</span>
        </div>
        <div class="home-card" onclick="quickFill('Explain how artificial intelligence works simply')">
          <span class="material-icons">psychology</span>
          <span>Explain a concept</span>
        </div>
        <div class="home-card" onclick="quickFill('Write an email requesting leave tomorrow')">
          <span class="material-icons">edit_note</span>
          <span>Help me write an email</span>
        </div>
      </div>
    </div>

    <!-- Interactive Input Dock -->
    <div class="footer-bar">
      <div class="input-pill">
        <button class="icon-click" onclick="quickFill('Deep research on: ')" title="Deep Search">
          <span class="material-icons">add</span>
        </button>
        
        <input type="text" id="userInput" class="chat-input" placeholder="Ask Sudarshana" oninput="onInputChange()" onkeydown="checkEnter(event)">
        
        <button class="icon-click" id="micButton" onclick="triggerSpeechRecognition()" title="Voice Input">
          <span class="material-icons">mic</span>
        </button>

        <button class="submit-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <span class="material-icons" id="sendIcon">graphic_eq</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- KEY & GEMINI 3.6 PROXY SETUP ---
    const part1 = "AQ.Ab8RN6Kky";
    const part2 = "EvbiqLRoB-g_LOr7";
    const part3 = "7UH9Iz3TEGqQF1bO_Quo35UEA";
    const GEMINI_API_KEY = part1 + part2 + part3;

    // Google recommended latest 3.6-flash model
    async function askGeminiAI(userPrompt) {
      const endpoint = "/api/gemini/models/gemini-3.6-flash:generateContent";

      const systemPrompt = "You are Sudarshana AI. Act as an exceptionally intelligent, polite, ChatGPT-like assistant. Provide helpful, structured, clear, and comprehensive answers in pure English.";

      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": GEMINI_API_KEY
        },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `System Instruction: ${systemPrompt}\n\nUser Question: ${userPrompt}`
            }]
          }]
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error?.message || response.statusText || ("HTTP " + response.status));
      }

      return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received from model.";
    }

    // --- SEND MESSAGE FUNCTION ---
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      const cards = document.getElementById('homeCards');
      if (cards) cards.remove();

      // Append User Bubble
      const userBubble = document.createElement('div');
      userBubble.className = 'user-bubble';
      userBubble.textContent = text;
      chatBox.appendChild(userBubble);

      input.value = '';
      onInputChange();
      chatBox.scrollTop = chatBox.scrollHeight;

      // Append Thinking Indicator
      const aiBubble = document.createElement('div');
      aiBubble.className = 'ai-bubble';
      aiBubble.innerHTML = `<i style="color: #94a3b8;">Sudarshana is writing...</i>`;
      chatBox.appendChild(aiBubble);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const responseText = await askGeminiAI(text);
        aiBubble.innerHTML = `
          <div class="msg-content">${responseText.replace(/\n/g, '<br>')}</div>
          <div class="msg-actions">
            <button class="msg-act-btn" onclick="copyBubbleText(this)"><span class="material-icons" style="font-size:14px;">content_copy</span> Copy</button>
            <button class="msg-act-btn" onclick="speakBubbleText(this)"><span class="material-icons" style="font-size:14px;">volume_up</span> Read</button>
          </div>
        `;
      } catch (err) {
        aiBubble.innerHTML = `<span style="color: #f87171;">Connection error: ${err.message}</span>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- UI HELPERS & LISTENERS ---
    function onInputChange() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const sendIcon = document.getElementById('sendIcon');

      if (input.value.trim().length > 0) {
        sendBtn.classList.add('send-active');
        sendIcon.textContent = 'send';
      } else {
        sendBtn.classList.remove('send-active');
        sendIcon.textContent = 'graphic_eq';
      }
    }

    function checkEnter(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function quickFill(val) {
      const input = document.getElementById('userInput');
      input.value = val;
      input.focus();
      onInputChange();
    }

    function newChat() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = `
        <div class="home-cards" id="homeCards">
          <div class="home-card" onclick="quickFill('Create an image description of a cosmic city')">
            <span class="material-icons">palette</span>
            <span>Create an image prompt</span>
          </div>
          <div class="home-card" onclick="quickFill('Explain how artificial intelligence works simply')">
            <span class="material-icons">psychology</span>
            <span>Explain a concept</span>
          </div>
          <div class="home-card" onclick="quickFill('Write an email requesting leave tomorrow')">
            <span class="material-icons">edit_note</span>
            <span>Help me write an email</span>
          </div>
        </div>
      `;
      closeMenu();
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('active');
      document.getElementById('sideOverlay').classList.add('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('sideOverlay').classList.remove('active');
    }

    function toggleMenu() {
      document.getElementById('menuDropdown').classList.toggle('active');
    }

    function closeMenu() {
      const menu = document.getElementById('menuDropdown');
      if (menu) menu.classList.remove('active');
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.header')) {
        closeMenu();
      }
    });

    function copyBubbleText(btn) {
      const parent = btn.closest('.ai-bubble');
      const text = parent.querySelector('.msg-content').innerText;
      navigator.clipboard.writeText(text);
      btn.innerHTML = `<span class="material-icons" style="font-size:14px;">check</span> Copied`;
      setTimeout(() => {
        btn.innerHTML = `<span class="material-icons" style="font-size:14px;">content_copy</span> Copy`;
      }, 1500);
    }

    function speakBubbleText(btn) {
      const parent = btn.closest('.ai-bubble');
      const text = parent.querySelector('.msg-content').innerText;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        window.speechSynthesis.speak(utter);
      }
    }

    function triggerSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported on this browser.");
        return;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'en-US';
      const micBtn = document.getElementById('micButton');
      micBtn.style.color = '#38bdf8';

      rec.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        onInputChange();
        micBtn.style.color = '#888';
      };
      rec.onerror = () => { micBtn.style.color = '#888'; };
      rec.onend = () => { micBtn.style.color = '#888'; };
      rec.start();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudarshana Chat AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230f172a' stroke='%2338bdf8' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%230284c7'/%3E%3Cg stroke='%2338bdf8' stroke-width='3'%3E%3Cline x1='50' y1='6' x2='50' y2='94'/%3E%3Cline x1='6' y1='50' x2='94' y2='50'/%3E%3Cline x1='19' y1='19' x2='81' y2='81'/%3E%3Cline x1='19' y1='81' x2='81' y2='19'/%3E%3C/g%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* THEME SYSTEM */
    :root {
      --bg: #030712;
      --card: #091122;
      --card-hover: #0f1c38;
      --border: #172442;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --dock-bg: #0b1426;
    }

    body.theme-light {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.2);
      --dock-bg: #ffffff;
    }

    body.theme-neon {
      --bg: #070114;
      --card: #14042e;
      --card-hover: #22084d;
      --border: #3b127f;
      --text: #fdf4ff;
      --muted: #c084fc;
      --accent: #e879f9;
      --accent-glow: rgba(232, 121, 249, 0.35);
      --dock-bg: #160633;
    }

    body.theme-nature {
      --bg: #03140e;
      --card: #072419;
      --card-hover: #0c3324;
      --border: #114a34;
      --text: #ecfdf5;
      --muted: #6ee7b7;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --dock-bg: #08261b;
    }

    body.theme-cyberpunk {
      --bg: #0a0118;
      --card: #1d0338;
      --card-hover: #2e0557;
      --border: #4d0b74;
      --text: #ffffff;
      --muted: #f472b6;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.35);
      --dock-bg: #21043f;
    }

    body.theme-sunset {
      --bg: #140704;
      --card: #270f08;
      --card-hover: #36170d;
      --border: #4a2113;
      --text: #fff7ed;
      --muted: #fdba74;
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.35);
      --dock-bg: #2a110a;
    }

    body.theme-space {
      --bg: #020617;
      --card: #071033;
      --card-hover: #0c1c54;
      --border: #142466;
      --text: #f0fdf4;
      --muted: #7dd3fc;
      --accent: #0ea5e9;
      --accent-glow: rgba(14, 165, 233, 0.35);
      --dock-bg: #091338;
    }

    body.theme-minimal {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --border: #cbd5e1;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.2);
      --dock-bg: #ffffff;
    }

    /* Core Solid Layout */
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Spinning Golden & Cyan Sudarshana Chakra */
    .chakra-spin {
      width: 34px;
      height: 34px;
      animation: spinChakra 10s linear infinite;
      cursor: pointer;
      flex-shrink: 0;
    }
    @keyframes spinChakra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Top Sticky Header */
    .app-header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--accent); }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .theme-chip {
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Main Container */
    .main-content {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      padding: 16px 0 24px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 20px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 14px;
    }
    .hero-title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }
    .glow-text {
      color: var(--accent);
      background: linear-gradient(135deg, var(--accent) 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* Input Dock */
    .input-dock {
      background: var(--dock-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 16px var(--accent-glow);
      margin-bottom: 18px;
    }
    .input-dock input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    .input-dock input::placeholder {
      color: var(--muted);
      font-size: 14px;
    }
    .dock-send {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Action Chips */
    .chips-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 34px;
    }
    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .chip .material-icons {
      font-size: 16px;
      color: var(--accent);
    }

    /* Headings */
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sec-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Quick Access Grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 34px;
    }
    .quick-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
    }
    .quick-box:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .quick-box .material-icons {
      font-size: 26px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .quick-box h4 {
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .quick-box p {
      font-size: 11px;
      color: var(--muted);
    }

    /* Popular Tools Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 34px;
    }
    .tool-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .tool-box:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .tool-box .material-icons {
      font-size: 24px;
      color: var(--accent);
    }
    .tool-box h4 {
      font-size: 13.5px;
      font-weight: 600;
    }
    .tool-box p {
      font-size: 11px;
      color: var(--muted);
    }

    /* Recent Chats */
    .recent-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 34px;
    }
    .recent-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .recent-item:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .recent-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .recent-left .material-icons {
      color: var(--accent);
      font-size: 20px;
    }
    .recent-item h4 {
      font-size: 13.5px;
      font-weight: 600;
    }
    .recent-item p {
      font-size: 11px;
      color: var(--muted);
    }

    /* Banner */
    .banner {
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .banner h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .banner p {
      font-size: 12px;
      color: var(--muted);
    }
    .banner-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Sidebar Drawer */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 998;
    }
    .sidebar-overlay.active { display: block; }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100%;
      background: var(--card);
      border-right: 1px solid var(--border);
      z-index: 999;
      transition: left 0.25s ease-out;
      display: flex;
      flex-direction: column;
    }
    .sidebar-drawer.active { left: 0; }

    .drawer-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .drawer-sec-title {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      padding: 10px 8px 4px;
    }
    .drawer-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 10px;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .drawer-btn:hover {
      background: var(--card-hover);
      color: var(--accent);
    }
    .drawer-btn .material-icons {
      font-size: 19px;
      color: var(--muted);
    }
    .drawer-btn:hover .material-icons {
      color: var(--accent);
    }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user-msg {
      align-self: flex-end;
      background: var(--card-hover);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 82%;
      font-size: 14px;
    }
    .ai-msg {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--accent);
      padding: 14px;
      border-radius: 16px 16px 16px 4px;
      max-width: 88%;
      font-size: 14px;
      line-height: 1.5;
    }
    .modal-input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .modal-input-bar input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 14px;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    /* Themes Grid */
    .themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      padding: 16px;
    }
    .theme-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    .theme-item:hover { border-color: var(--accent); }
  </style>
</head>

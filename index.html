<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudarshana Chat AI - Studio & Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230f172a' stroke='%23f59e0b' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%230284c7'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. GLOBAL RESET & FOUNDATIONS
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease, box-shadow 0.25s ease;
    }

    /* ==========================================================================
       2. FULL 8 DYNAMIC THEME SYSTEM (VIBRANT & ACCURATE)
       ========================================================================== */
    :root {
      /* Dark Default Theme */
      --bg-base: #030712;
      --bg-gradient: radial-gradient(circle at 50% -10%, #0e1c3b 0%, #030712 70%);
      --sidebar-bg: #070c18;
      --sidebar-border: #131f37;
      --card-bg: #091122;
      --card-border: #172442;
      --card-hover: #0f1d38;
      --dock-bg: rgba(9, 17, 34, 0.92);
      --dock-border: #1e3a8a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-secondary: #818cf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --chakra-gold: #f59e0b;
      --chakra-blue: #0284c7;
    }

    /* 1. Light Theme */
    body.theme-light {
      --bg-base: #f8fafc;
      --bg-gradient: linear-gradient(180deg, #f1f5f9 0%, #ffffff 100%);
      --sidebar-bg: #ffffff;
      --sidebar-border: #e2e8f0;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --card-hover: #f1f5f9;
      --dock-bg: rgba(255, 255, 255, 0.96);
      --dock-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-secondary: #0369a1;
      --accent-glow: rgba(2, 132, 199, 0.2);
      --chakra-gold: #f59e0b;
      --chakra-blue: #0284c7;
    }

    /* 2. Neon Theme */
    body.theme-neon {
      --bg-base: #070114;
      --bg-gradient: radial-gradient(circle at 50% -10%, #2f0752 0%, #070114 75%);
      --sidebar-bg: #0d0221;
      --sidebar-border: #260f54;
      --card-bg: #14042e;
      --card-border: #3b127f;
      --card-hover: #22084d;
      --dock-bg: rgba(20, 4, 46, 0.94);
      --dock-border: #701a75;
      --text-main: #fdf4ff;
      --text-muted: #c084fc;
      --accent: #e879f9;
      --accent-secondary: #a855f7;
      --accent-glow: rgba(232, 121, 249, 0.4);
      --chakra-gold: #e879f9;
      --chakra-blue: #c084fc;
    }

    /* 3. Nature Theme */
    body.theme-nature {
      --bg-base: #03140e;
      --bg-gradient: radial-gradient(circle at 50% -10%, #093827 0%, #02110c 75%);
      --sidebar-bg: #041a12;
      --sidebar-border: #0d3828;
      --card-bg: #072419;
      --card-border: #114a34;
      --card-hover: #0c3324;
      --dock-bg: rgba(7, 36, 25, 0.94);
      --dock-border: #065f46;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent: #10b981;
      --accent-secondary: #059669;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --chakra-gold: #f59e0b;
      --chakra-blue: #10b981;
    }

    /* 4. Cyberpunk Theme */
    body.theme-cyberpunk {
      --bg-base: #0a0118;
      --bg-gradient: radial-gradient(circle at 50% -10%, #3e084d 0%, #090117 75%);
      --sidebar-bg: #120224;
      --sidebar-border: #3c095c;
      --card-bg: #1d0338;
      --card-border: #4d0b74;
      --card-hover: #2e0557;
      --dock-bg: rgba(29, 3, 56, 0.94);
      --dock-border: #be185d;
      --text-main: #ffffff;
      --text-muted: #f472b6;
      --accent: #f43f5e;
      --accent-secondary: #ec4899;
      --accent-glow: rgba(244, 63, 94, 0.4);
      --chakra-gold: #f59e0b;
      --chakra-blue: #f43f5e;
    }

    /* 5. Sunset Theme */
    body.theme-sunset {
      --bg-base: #140704;
      --bg-gradient: radial-gradient(circle at 50% -10%, #45180c 0%, #120502 75%);
      --sidebar-bg: #1c0a05;
      --sidebar-border: #3d1b10;
      --card-bg: #270f08;
      --card-border: #4a2113;
      --card-hover: #36170d;
      --dock-bg: rgba(39, 15, 8, 0.94);
      --dock-border: #9a3412;
      --text-main: #fff7ed;
      --text-muted: #fdba74;
      --accent: #f97316;
      --accent-secondary: #ea580c;
      --accent-glow: rgba(249, 115, 22, 0.4);
      --chakra-gold: #fbbf24;
      --chakra-blue: #f97316;
    }

    /* 6. Space Theme */
    body.theme-space {
      --bg-base: #020617;
      --bg-gradient: radial-gradient(circle at 50% -10%, #0f1e4d 0%, #020617 80%);
      --sidebar-bg: #040920;
      --sidebar-border: #0f1c4d;
      --card-bg: #071033;
      --card-border: #142466;
      --card-hover: #0c1c54;
      --dock-bg: rgba(7, 16, 51, 0.94);
      --dock-border: #0369a1;
      --text-main: #f0fdf4;
      --text-muted: #7dd3fc;
      --accent: #0ea5e9;
      --accent-secondary: #38bdf8;
      --accent-glow: rgba(14, 165, 233, 0.4);
      --chakra-gold: #f59e0b;
      --chakra-blue: #0ea5e9;
    }

    /* 7. Minimal Theme */
    body.theme-minimal {
      --bg-base: #f1f5f9;
      --bg-gradient: radial-gradient(circle at 50% -10%, #e2e8f0 0%, #f8fafc 85%);
      --sidebar-bg: #ffffff;
      --sidebar-border: #cbd5e1;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --card-hover: #f8fafc;
      --dock-bg: rgba(255, 255, 255, 0.96);
      --dock-border: #94a3b8;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-secondary: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --chakra-gold: #f59e0b;
      --chakra-blue: #6366f1;
    }

    /* ==========================================================================
       3. DOCUMENT FLOW (FAIL-SAFE BLOCK ARCHITECTURE)
       ========================================================================== */
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-base);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ==========================================================================
       4. SACRED ORIGINAL ROTATING SUDARSHANA CHAKRA
       ========================================================================== */
    .sudarshana-chakra {
      width: 34px;
      height: 34px;
      animation: spinChakra 11s linear infinite;
      cursor: pointer;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5));
    }

    @keyframes spinChakra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ==========================================================================
       5. TOP STICKY APPLICATION BAR
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      background: var(--bg-base);
      border-bottom: 1px solid var(--sidebar-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text-main);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      color: var(--text-main);
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .theme-pill-btn:hover {
      transform: translateY(-2px);
    }

    /* ==========================================================================
       6. MAIN CONTENT WRAPPER & HERO DASHBOARD
       ========================================================================== */
    .main-wrapper {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      display: block;
    }

    .hero-section {
      text-align: center;
      padding: 10px 0 32px;
      position: relative;
    }

    .hero-chakra-large {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      animation: spinChakra 24s linear infinite;
      display: block;
      filter: drop-shadow(0 0 28px rgba(245, 158, 11, 0.7));
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 30px;
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .hero-title {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.2px;
      margin-bottom: 8px;
    }

    .glow-text {
      color: var(--accent);
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .dot-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ==========================================================================
       7. MAIN SEARCH DOCK (NEON FLOATING INPUT)
       ========================================================================== */
    .search-dock-wrapper {
      width: 100%;
      margin-bottom: 18px;
    }

    .search-dock {
      background: var(--dock-bg);
      border: 1px solid var(--dock-border);
      border-radius: 30px;
      padding: 8px 14px 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4), 0 0 24px var(--accent-glow);
    }

    .search-dock:focus-within {
      border-color: var(--accent);
    }

    .search-dock input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15.5px;
      font-family: inherit;
    }

    .search-dock input::placeholder {
      color: var(--text-muted);
      font-size: 14px;
    }

    .dock-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dock-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .dock-icon-btn:hover {
      color: var(--accent);
    }

    .dock-send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 14px var(--accent-glow);
    }

    .dock-send-btn:hover {
      transform: scale(1.05);
    }

    /* ==========================================================================
       8. ACTION CHIPS
       ========================================================================== */
    .chips-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 40px;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 7px 16px;
      border-radius: 24px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text-main);
      transform: translateY(-2px);
    }

    .chip .material-icons {
      font-size: 17px;
      color: var(--accent);
    }

    /* ==========================================================================
       9. DASHBOARD SECTION HEADINGS & VIEW ALL
       ========================================================================== */
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .sec-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .view-all-link {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .view-all-link:hover {
      text-decoration: underline;
    }

    /* ==========================================================================
       10. QUICK ACCESS SECTION (5 DISTINCT CARDS)
       ========================================================================== */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 42px;
    }

    .quick-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
    }

    .quick-box:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .quick-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .quick-box.blue .quick-icon-box { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .quick-box.cyan .quick-icon-box { background: rgba(45, 212, 191, 0.15); color: #2dd4bf; }
    .quick-box.purple .quick-icon-box { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .quick-box.orange .quick-icon-box { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
    .quick-box.pink .quick-icon-box { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }

    .quick-box h4 { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
    .quick-box p { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

    /* ==========================================================================
       11. POPULAR TOOLS (4 DETAILED STUDIO CARDS)
       ========================================================================== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 42px;
    }

    .tool-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .tool-box:hover {
      border-color: var(--accent);
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .tool-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--card-hover);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tool-box h4 { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
    .tool-box p { font-size: 11.5px; color: var(--text-muted); }

    /* ==========================================================================
       12. RECENT CHATS LIST
       ========================================================================== */
    .recent-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 42px;
    }

    .recent-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .recent-item:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .recent-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .recent-left .material-icons {
      color: var(--accent);
      font-size: 22px;
    }

    .recent-item h4 { font-size: 14px; font-weight: 600; }
    .recent-item p { font-size: 12px; color: var(--text-muted); }

    /* ==========================================================================
       13. BANNER & PERKS FOOTER
       ========================================================================== */
    .banner {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 22px;
      padding: 26px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 38px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .banner h3 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
    .banner p { font-size: 13px; color: var(--text-muted); }

    .banner-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 26px;
      font-weight: 700;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .footer-perks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      padding-top: 28px;
      border-top: 1px solid var(--card-border);
    }

    .perk-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .perk-box .material-icons {
      font-size: 26px;
      color: var(--accent);
    }

    .perk-box h5 { font-size: 13.5px; font-weight: 600; }
    .perk-box p { font-size: 11.5px; color: var(--text-muted); }

    /* ==========================================================================
       14. LEFT NAVIGATION SIDEBAR DRAWER
       ========================================================================== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 998;
    }

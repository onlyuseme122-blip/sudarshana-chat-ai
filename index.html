<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudarshana Chat AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230f172a' stroke='%2338bdf8' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%230284c7'/%3E%3Cg stroke='%2338bdf8' stroke-width='3'%3E%3Cline x1='50' y1='6' x2='50' y2='94'/%3E%3Cline x1='6' y1='50' x2='94' y2='50'/%3E%3Cline x1='19' y1='19' x2='81' y2='81'/%3E%3Cline x1='19' y1='81' x2='81' y2='19'/%3E%3C/g%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --bg-dark: #030712;
      --sidebar-bg: #070c18;
      --card-bg: #0c1427;
      --card-border: #1a2744;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Left Sidebar Menu */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid #131f37;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      flex-shrink: 0;
      min-height: 100vh;
      position: sticky;
      top: 0;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px 8px;
      border-bottom: 1px solid #131f37;
      margin-bottom: 16px;
    }

    .chakra-icon {
      width: 38px;
      height: 38px;
      animation: spinChakra 14s linear infinite;
    }

    @keyframes spinChakra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      color: #94a3b8;
      font-size: 14.5px;
      font-weight: 500;
      border-radius: 12px;
      background: none;
      border: none;
      width: 100%;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .nav-item .material-icons {
      font-size: 20px;
      color: #64748b;
    }

    .nav-item:hover, .nav-item.active {
      background: #0f1d38;
      color: #38bdf8;
    }

    .nav-item:hover .material-icons, .nav-item.active .material-icons {
      color: #38bdf8;
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid #131f37;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .powered-by {
      font-size: 11px;
      color: #64748b;
      padding: 0 8px;
    }

    .powered-by strong {
      color: #94a3b8;
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }

    /* Main Content Area */
    .main-wrapper {
      flex: 1;
      min-width: 0;
      position: relative;
      background: radial-gradient(circle at 50% 0%, #0d1b38 0%, #030712 60%);
      padding: 24px 36px 60px;
      overflow-y: auto;
      max-height: 100vh;
    }

    /* Top Utility Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .top-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(15, 29, 56, 0.6);
      border: 1px solid #1a2744;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .top-icon-btn:hover {
      color: #fff;
      border-color: #38bdf8;
    }

    /* Hero Section with Glowing Cosmic Chakra */
    .hero-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px 10px 40px;
    }

    .cosmic-chakra-bg {
      position: absolute;
      top: -40px;
      left: 60px;
      width: 170px;
      height: 170px;
      pointer-events: none;
      animation: spinChakra 28s linear infinite;
      opacity: 0.85;
      filter: drop-shadow(0 0 35px rgba(245, 158, 11, 0.6));
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 30px;
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 22px;
      cursor: pointer;
    }

    .hero-title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .hero-title .glow-text {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    .dot-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #38bdf8;
    }

    /* Main Glow Search Box */
    .search-dock-wrapper {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 20px;
    }

    .search-dock {
      background: rgba(10, 18, 38, 0.85);
      border: 1px solid #1e3a8a;
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 35px rgba(30, 58, 138, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .search-dock:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.4);
    }

    .sparkle-icon {
      color: #38bdf8;
      font-size: 26px;
    }

    .search-dock input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }

    .search-dock input::placeholder {
      color: #64748b;
      font-size: 14.5px;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      background: none;
      border: none;
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    .send-action-btn {
      background: #0284c7;
      color: #fff;
    }

    .send-action-btn:hover {
      background: #0369a1;
      color: #fff;
    }

    /* Action Chips */
    .action-chips-wrapper {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 48px;
    }

    .chip-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(15, 29, 56, 0.5);
      border: 1px solid #1a2744;
      border-radius: 30px;
      color: #94a3b8;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-item:hover {
      background: #14244a;
      color: #fff;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .chip-item .material-icons {
      font-size: 18px;
      color: #38bdf8;
    }

    /* Section Headers */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 700;
      color: #fff;
    }

    .view-all-link {
      font-size: 13.5px;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Quick Access 5 Cards */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 44px;
    }

    .quick-card {
      padding: 22px 18px;
      border-radius: 20px;
      background: #091122;
      border: 1px solid #172442;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .quick-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .quick-card.blue { border-color: rgba(56, 189, 248, 0.4); }
    .quick-card.blue .card-icon-box { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .quick-card.cyan { border-color: rgba(45, 212, 191, 0.4); }
    .quick-card.cyan .card-icon-box { background: rgba(45, 212, 191, 0.15); color: #2dd4bf; }
    .quick-card.purple { border-color: rgba(168, 85, 247, 0.4); }
    .quick-card.purple .card-icon-box { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .quick-card.orange { border-color: rgba(251, 146, 60, 0.4); }
    .quick-card.orange .card-icon-box { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
    .quick-card.pink { border-color: rgba(244, 63, 94, 0.4); }
    .quick-card.pink .card-icon-box { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }

    .card-icon-box {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .card-icon-box .material-icons {
      font-size: 26px;
    }

    .quick-card h4 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .quick-card p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Popular Tools 4 Cards */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 44px;
    }

    .tool-card {
      background: #091122;
      border: 1px solid #172442;
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tool-card:hover {
      background: #0f1c38;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .tool-icon-box {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tool-icon-box.blue { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .tool-icon-box.pink { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
    .tool-icon-box.teal { background: rgba(20, 184, 166, 0.15); color: #14b8a6; }
    .tool-icon-box.cyan { background: rgba(2, 132, 199, 0.15); color: #38bdf8; }

    .tool-card h4 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .tool-card p {
      font-size: 12px;
      color: #64748b;
    }

    /* Recent Chats List */
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 44px;
    }

    .recent-item {
      background: #091122;
      border: 1px solid #172442;
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }

    .recent-item:hover {
      border-color: #38bdf8;
      background: #0e1a36;
    }

    .recent-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .recent-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .recent-info h4 {
      font-size: 14.5px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }

    .recent-info p {
      font-size: 12.5px;
      color: #64748b;
    }

    .recent-right {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #64748b;
      font-size: 12px;
    }

    /* Cosmic Banner */
    .explore-banner {
      background: linear-gradient(135deg, #101c38 0%, #081126 100%);
      border: 1px solid #1e3a8a;
      border-radius: 24px;
      padding: 30px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .banner-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .banner-desc {
      font-size: 13.5px;
      color: #94a3b8;
    }

    .banner-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }

    .banner-btn:hover {
      transform: scale(1.03);
    }

    /* Footer Perks */
    .footer-perks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding-top: 24px;
      border-top: 1px solid #131f37;
    }

    .perk-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .perk-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 29, 56, 0.6);
      border: 1px solid #1a2744;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
    }

    .perk-info h5 {
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }

    .perk-info p {
      font-size: 11.5px;
      color: #64748b;
    }

    /* Live Chat Modal (Opens when user queries AI) */
    .chat-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .chat-modal-overlay.active {
      display: flex;
    }

    .chat-modal {
      width: 100%;
      max-width: 720px;
      height: 85vh;
      background: #090f1d;
      border: 1px solid #1a294d;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .chat-modal-header {
      padding: 16px 20px;
      background: #0e172c;
      border-bottom: 1px solid #1a294d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-modal-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-user-bubble {
      align-self: flex-end;
      background: #1e293b;
      color: #fff;
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      max-width: 80%;
      font-size: 14.5px;
      word-break: break-word;
    }

    .modal-ai-bubble {
      align-self: flex-start;
      background: #0d1b38;
      border: 1px solid #1a3266;
      color: #e2e8f0;
      padding: 16px 20px;
      border-radius: 18px 18px 18px 4px;
      max-width: 85%;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
    }

    .modal-chat-input-bar {
      padding: 14px 20px;
      background: #0e172c;
      border-top: 1px solid #1a294d;
      display: flex;
      gap: 10px;
    }

    .modal-input {
      flex: 1;
      background: #090f1d;
      border: 1px solid #1a294d;
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      outline: none;
      font-size: 14.5px;
    }

    .modal-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 868px) {
      body { flex-direction: column; }
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        width: 280px;
        height: 100%;
        background: #070c18;
      }
      .sidebar.open { left: 0; }
      .main-wrapper { padding: 16px 16px 40px; }
      .hero-title { font-size: 32px; }
      .cosmic-chakra-bg { left: 10px; width: 120px; height: 120px; }
      .explore-banner { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Menu -->
  <aside class="sidebar" id="mainSidebar">
    <div>
      <!-- Sudarshana Brand -->
      <div class="brand-box">
        <svg class="chakra-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
          <g fill="#0284c7" stroke="#38bdf8" stroke-width="1.5">
            <polygon points="50,2 54,14 46,14"/>
            <polygon points="50,98 54,86 46,86"/>
            <polygon points="2,50 14,54 14,46"/>
            <polygon points="98,50 86,54 86,46"/>
            <polygon points="16,16 26,22 20,28"/>
            <polygon points="84,84 74,78 80,72"/>
            <polygon points="16,84 20,72 26,78"/>
            <polygon points="84,16 80,28 74,22"/>
          </g>
          <circle cx="50" cy="50" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="50" cy="50" r="12" fill="#0284c7"/>
        </svg>
        <div>
          <div class="brand-title">Sudarshana</div>
          <div class="brand-subtitle">Chat AI</div>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="nav-links">
        <button class="nav-item active" onclick="location.reload()"><span class="material-icons">home</span> Home</button>
        <button class="nav-item" onclick="openChatModal('Hello! How can I assist you today?')"><span class="material-icons">chat</span> Chat</button>
        <button class="nav-item" onclick="triggerPreset('Generate high quality cosmic artwork: ')"><span class="material-icons">image</span> Images</button>
        <button class="nav-item" onclick="triggerPreset('Create script and prompt for cinematic AI video: ')"><span class="material-icons">movie</span> Videos</button>
        <button class="nav-item" onclick="trigger

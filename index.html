<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudarshana Chat AI - Themes & Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230f172a' stroke='%2338bdf8' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%230284c7'/%3E%3Cg stroke='%2338bdf8' stroke-width='3'%3E%3Cline x1='50' y1='6' x2='50' y2='94'/%3E%3Cline x1='6' y1='50' x2='94' y2='50'/%3E%3Cline x1='19' y1='19' x2='81' y2='81'/%3E%3Cline x1='19' y1='81' x2='81' y2='19'/%3E%3C/g%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease;
    }
    
    /* THEME VARIABLES DEFINITION */
    :root {
      --bg-dark: #030712;
      --bg-gradient: radial-gradient(circle at 50% 0%, #0d1b38 0%, #030712 65%);
      --sidebar-bg: #070c18;
      --sidebar-border: #131f37;
      --card-bg: #091122;
      --card-border: #172442;
      --card-hover: #0f1c38;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --dock-bg: rgba(10, 18, 38, 0.85);
      --dock-border: #1e3a8a;
    }

    /* 1. Light Theme */
    body.theme-light {
      --bg-dark: #f8fafc;
      --bg-gradient: linear-gradient(180deg, #f1f5f9 0%, #ffffff 100%);
      --sidebar-bg: #ffffff;
      --sidebar-border: #e2e8f0;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.2);
      --dock-bg: rgba(255, 255, 255, 0.95);
      --dock-border: #cbd5e1;
    }

    /* 2. Neon Theme */
    body.theme-neon {
      --bg-dark: #070114;
      --bg-gradient: radial-gradient(circle at 50% 10%, #290849 0%, #070114 70%);
      --sidebar-bg: #0d0221;
      --sidebar-border: #260f54;
      --card-bg: #14042e;
      --card-border: #3b127f;
      --card-hover: #22084d;
      --text-main: #fdf4ff;
      --text-muted: #c084fc;
      --accent: #e879f9;
      --accent-glow: rgba(232, 121, 249, 0.4);
      --dock-bg: rgba(20, 4, 46, 0.88);
      --dock-border: #701a75;
    }

    /* 3. Nature Theme */
    body.theme-nature {
      --bg-dark: #03140e;
      --bg-gradient: radial-gradient(circle at 50% 0%, #062b1e 0%, #02110c 70%);
      --sidebar-bg: #041a12;
      --sidebar-border: #0d3828;
      --card-bg: #072419;
      --card-border: #114a34;
      --card-hover: #0c3324;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --dock-bg: rgba(7, 36, 25, 0.88);
      --dock-border: #065f46;
    }

    /* 4. Cyberpunk Theme */
    body.theme-cyberpunk {
      --bg-dark: #0a0118;
      --bg-gradient: radial-gradient(circle at 50% 0%, #350841 0%, #090117 70%);
      --sidebar-bg: #120224;
      --sidebar-border: #3c095c;
      --card-bg: #1d0338;
      --card-border: #4d0b74;
      --card-hover: #2e0557;
      --text-main: #fff;
      --text-muted: #f472b6;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.4);
      --dock-bg: rgba(29, 3, 56, 0.88);
      --dock-border: #be185d;
    }

    /* 5. Sunset Theme */
    body.theme-sunset {
      --bg-dark: #140704;
      --bg-gradient: radial-gradient(circle at 50% 0%, #3b160b 0%, #120502 70%);
      --sidebar-bg: #1c0a05;
      --sidebar-border: #3d1b10;
      --card-bg: #270f08;
      --card-border: #4a2113;
      --card-hover: #36170d;
      --text-main: #fff7ed;
      --text-muted: #fdba74;
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.4);
      --dock-bg: rgba(39, 15, 8, 0.88);
      --dock-border: #9a3412;
    }

    /* 6. Space Theme */
    body.theme-space {
      --bg-dark: #020617;
      --bg-gradient: radial-gradient(circle at 50% 0%, #0b1536 0%, #020617 75%);
      --sidebar-bg: #040920;
      --sidebar-border: #0f1c4d;
      --card-bg: #071033;
      --card-border: #142466;
      --card-hover: #0c1c54;
      --text-main: #f0fdf4;
      --text-muted: #7dd3fc;
      --accent: #0ea5e9;
      --accent-glow: rgba(14, 165, 233, 0.4);
      --dock-bg: rgba(7, 16, 51, 0.88);
      --dock-border: #0369a1;
    }

    /* 7. Minimal Theme */
    body.theme-minimal {
      --bg-dark: #f1f5f9;
      --bg-gradient: radial-gradient(circle at 50% 0%, #e2e8f0 0%, #f8fafc 80%);
      --sidebar-bg: #ffffff;
      --sidebar-border: #cbd5e1;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --dock-bg: rgba(255, 255, 255, 0.95);
      --dock-border: #94a3b8;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Left Sidebar Menu */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      flex-shrink: 0;
      min-height: 100vh;
      position: sticky;
      top: 0;
      z-index: 50;
      transition: left 0.3s ease;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px 8px;
      border-bottom: 1px solid var(--sidebar-border);
      margin-bottom: 16px;
    }

    .chakra-icon {
      width: 36px;
      height: 36px;
      animation: spinChakra 12s linear infinite;
    }

    @keyframes spinChakra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 500;
      border-radius: 12px;
      background: none;
      border: none;
      width: 100%;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .nav-item .material-icons {
      font-size: 20px;
      color: var(--text-muted);
    }

    .nav-item:hover, .nav-item.active {
      background: var(--card-hover);
      color: var(--accent);
    }

    .nav-item:hover .material-icons, .nav-item.active .material-icons {
      color: var(--accent);
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .powered-by {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 8px;
    }

    .powered-by strong {
      color: var(--text-main);
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }

    /* Main Content Wrapper */
    .main-wrapper {
      flex: 1;
      min-width: 0;
      background: var(--bg-gradient);
      padding: 24px 36px 60px;
      overflow-y: auto;
      max-height: 100vh;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .mobile-menu-toggle {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .theme-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      color: var(--text-main);
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .theme-trigger-btn:hover {
      transform: translateY(-2px);
    }

    .top-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .top-icon-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    /* Hero Section */
    .hero-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 10px 36px;
    }

    .cosmic-chakra-bg {
      position: absolute;
      top: -30px;
      left: 50px;
      width: 150px;
      height: 150px;
      pointer-events: none;
      animation: spinChakra 24s linear infinite;
      opacity: 0.8;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 30px;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 20px;
      cursor: pointer;
    }

    .hero-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .glow-text {
      background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 34px;
    }

    .dot-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Floating Glowing Search Dock */
    .search-dock-wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 20px;
    }

    .search-dock {
      background: var(--dock-bg);
      border: 1px solid var(--dock-border);
      border-radius: 24px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4), 0 0 25px var(--accent-glow);
    }

    .search-dock input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15.5px;
      font-family: inherit;
    }

    .search-dock input::placeholder {
      color: var(--text-muted);
      font-size: 14px;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-btn:hover {
      color: var(--accent);
      background: var(--card-hover);
    }

    .send-action-btn {
      background: var(--accent);
      color: #fff !important;
    }

    .send-action-btn:hover {
      opacity: 0.9;
    }

    /* Action Chips */
    .action-chips-wrapper {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 44px;
    }

    .chip-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      color: var(--text-muted);
      font-size: 13.5px;
      cursor: pointer;
    }

    .chip-item:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .chip-item .material-icons {
      font-size: 17px;
      color: var(--accent);
    }

    /* Section Headings */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .view-all-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    /* Quick Access 5 Cards */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .quick-card {
      padding: 22px 16px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    .quick-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      background: var(--card-hover);
      color: var(--accent);
    }

    .card-icon-box .material-icons { font-size: 26px; }

    .quick-card h4 {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .quick-card p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Popular Tools (4 Cards) */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    .tool-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .tool-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-hover);
      color: var(--accent);
      flex-shrink: 0;
    }

    .tool-card h4 {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .tool-card p {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Recent Chats */
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    .recent-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .recent-item:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .recent-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .recent-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--card-hover);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .recent-info h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .recent-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .recent-right {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Banner */
    .explore-banner {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 22px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .banner-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .banner-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .banner-btn {
      padding: 12px 24px;
      background: var(--accent);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* Footer Perks */
    .footer-perks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      padding-top: 24px;
      border-top: 1px solid var(--sidebar-border);
    }

    .perk-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .perk-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .perk-info h5 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .perk-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ========================================================= */
    /* 8-THEME GALLERY MODAL (Exact match with reference image) */
    /* ========================================================= */
    .theme-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    .theme-modal-overlay.active {
      display: flex;
    }

    .theme-modal-container {
      width: 100%;
      max-width: 960px;
      background: #080d1a;
      border: 1px solid #1a2a4d;
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.9);
      position: relative;
    }

    .theme-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .theme-modal-title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }

    .theme-modal-title span {
      color: #38bdf8;
    }

    .theme-modal-sub {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .theme-grid-8 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .theme-card-pick {
      background: #0d1527;
      border: 2px solid #172442;
      border-rad
